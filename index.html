<script>
'use strict';
const DATA=[{"id":"wayback-machine","name":"Wayback Machine","category":"RECON","objectives":"2.4","purpose":"View archived versions of websites, including older pages and removed links.","clue":"You need to learn what a company's website showed last year without visiting the live site.","memory":"Way back means the website went back in time.","contrast":"Shodan indexes current internet exposure; Wayback shows historical pages.","official":true},{"id":"maltego","name":"Maltego","category":"RECON","objectives":"2.4, 4.8","purpose":"Build visual graphs linking people, domains, emails, and infrastructure using OSINT transforms.","clue":"The question asks to visualize relationships between employees and domains.","memory":"Maltego makes a map of who is connected to whom.","contrast":"theHarvester collects lists; Maltego draws connections.","official":true},{"id":"recon-ng","name":"Recon-ng","category":"RECON","objectives":"2.4, 4.8","purpose":"Modular reconnaissance framework with workspaces, modules, and stored results.","clue":"A tester wants repeatable OSINT collection using interchangeable modules.","memory":"Recon-ng = reconnaissance with gears (modules).","contrast":"SpiderFoot emphasizes automated aggregation; Recon-ng is a modular framework.","official":true},{"id":"shodan","name":"Shodan","category":"RECON","objectives":"2.4","purpose":"Search pre-collected internet-facing device and service banners.","clue":"Find exposed RDP or industrial devices without actively scanning the target.","memory":"Show-dan shows devices already exposed.","contrast":"Nmap sends your own probes; Shodan searches an existing index.","official":true},{"id":"spiderfoot","name":"SpiderFoot","category":"RECON","objectives":"2.4","purpose":"Automate collection and correlation of public intelligence about domains, IPs, and leaks.","clue":"Gather broad OSINT from many data sources with minimal manual effort.","memory":"A spider's many feet crawl many OSINT sources.","contrast":"Recon-ng has modules you run; SpiderFoot emphasizes automated aggregation.","official":true},{"id":"whois","name":"WHOIS","category":"RECON","objectives":"2.4","purpose":"Look up domain registration details such as registrar, dates, and available registrant records.","clue":"Who registered this domain, and when does it expire?","memory":"WHO IS the domain owner?","contrast":"dig looks up DNS records, not registration records.","official":true},{"id":"nslookup","name":"nslookup","category":"RECON","objectives":"2.4","purpose":"Query DNS for hostname resolution and records such as MX, NS, and TXT.","clue":"Which command will show a domain's mail exchanger or IP record?","memory":"Name Server LOOKUP looks up names.","contrast":"WHOIS is registration; nslookup is DNS data.","official":true},{"id":"dig","name":"dig","category":"RECON","objectives":"2.4","purpose":"Query and troubleshoot DNS records with detailed command-line output; can request AXFR.","clue":"The tester needs DNS TXT/MX results or a zone-transfer query.","memory":"DIG into DNS records.","contrast":"WHOIS asks who owns it; dig asks what DNS says.","official":true},{"id":"censys-io","name":"Censys.io","category":"RECON","objectives":"2.4","purpose":"Search internet-wide host, service, and certificate observations.","clue":"Investigate exposed TLS certificates and internet-facing hosts using scan databases.","memory":"Censys senses certificates and systems.","contrast":"Shodan is especially associated with device banners; Censys also emphasizes certificates.","official":true},{"id":"hunter-io","name":"Hunter.io","category":"RECON","objectives":"2.4","purpose":"Find published email addresses and common email patterns for a domain.","clue":"Find employee email formats to build an authorized contact list.","memory":"Hunter hunts email addresses.","contrast":"theHarvester covers email plus hosts and subdomains.","official":true},{"id":"dnsdumpster","name":"DNSdumpster","category":"RECON","objectives":"2.4","purpose":"Map a domain's public DNS records and related subdomains.","clue":"Quickly visualize subdomains and DNS infrastructure via a website.","memory":"Dump the DNS into a map.","contrast":"Amass performs deeper subdomain enumeration.","official":true},{"id":"amass","name":"Amass","category":"RECON","objectives":"2.4","purpose":"Enumerate subdomains using passive sources and optional active techniques.","clue":"Find a broad, deep list of a company's subdomains.","memory":"Amass amasses subdomains.","contrast":"DNSdumpster is a quick map; Amass is a deep enumeration tool.","official":true},{"id":"nmap","name":"Nmap","category":"RECON","objectives":"2.4, 4.2","purpose":"Discover live hosts, open ports, service versions, and possible OS details.","clue":"Find which services are listening on a target network.","memory":"Nmap = Network MAP of ports and services.","contrast":"Nessus scans for vulnerabilities; Nmap maps network exposure.","official":true},{"id":"nmap-scripting-engine-nse","name":"Nmap Scripting Engine (NSE)","category":"RECON","objectives":"2.4, 4.2","purpose":"Run Nmap scripts for enumeration, service checks, and vulnerability-related tests.","clue":"An Nmap scan must execute an SSL cipher or SMB enumeration script.","memory":"NSE = Nmap Scripts Extend the scanner.","contrast":"The Nmap base scan maps ports; NSE adds scripted behavior.","official":true},{"id":"theharvester","name":"theHarvester","category":"RECON","objectives":"2.4, 4.8","purpose":"Gather public emails, names, subdomains, and hostnames from search sources.","clue":"Collect publicly indexed employee emails and subdomains in a list.","memory":"The Harvester harvests names and emails.","contrast":"Maltego graphs links; Hunter.io focuses on email discovery.","official":true},{"id":"wigle-net","name":"WiGLE.net","category":"RECON","objectives":"2.4, 4.7","purpose":"Search a crowdsourced geographic database of wireless networks.","clue":"Locate recorded wireless SSIDs on a map without being on-site.","memory":"WiGLE = Wi-Fi on the globe.","contrast":"InSSIDer surveys nearby signals; WiGLE searches a global database.","official":true},{"id":"inssider","name":"InSSIDer","category":"WIRELESS","objectives":"2.4, 4.7","purpose":"Survey nearby Wi-Fi networks, channels, and signal levels.","clue":"A technician is physically on-site and needs channel overlap or signal strength.","memory":"InSSIDer is INSIDE the Wi-Fi area.","contrast":"WiGLE is a map database; Kismet emphasizes packet-level wireless monitoring.","official":true},{"id":"osintframework-com","name":"OSINTframework.com","category":"RECON","objectives":"2.4","purpose":"Browse a directory of open-source intelligence resources by category.","clue":"You need a catalog pointing you to appropriate OSINT services.","memory":"An OSINT framework is a menu of resources, not a scanner.","contrast":"Unlike SpiderFoot, it does not automatically collect results for you.","official":true},{"id":"wireshark","name":"Wireshark","category":"RECON","objectives":"2.4, 4.2, 4.9","purpose":"Capture and inspect network packets in a graphical interface.","clue":"Investigate packet fields or cleartext protocols in a PCAP using a GUI.","memory":"Wire-shark hunts through packets on the wire.","contrast":"tcpdump is command line; Wireshark is graphical analysis.","official":true},{"id":"tcpdump","name":"tcpdump","category":"RECON","objectives":"2.4, 4.2, 4.9","purpose":"Capture and filter packets from a command-line interface.","clue":"Capture packets on a headless Linux host or save a PCAP in a terminal.","memory":"TCP DUMP dumps packets to your terminal or file.","contrast":"Wireshark provides a graphical packet analyzer.","official":true},{"id":"aircrack-ng","name":"Aircrack-ng","category":"WIRELESS","objectives":"2.4, 4.7","purpose":"Suite for wireless packet capture, deauthentication testing, and WEP/WPA key auditing.","clue":"Capture a WPA handshake, then attempt authorized password auditing.","memory":"AIR CRACK cracks Wi-Fi keys.","contrast":"Kismet observes; Aircrack-ng includes active testing and cracking.","official":true},{"id":"netstat","name":"netstat","category":"POST","objectives":"5.2","purpose":"Show local listening sockets and active network connections.","clue":"After gaining authorized host access, list established sessions and listening ports.","memory":"NET STAT = network statistics on this computer.","contrast":"Nmap probes remote hosts; netstat inspects the local host.","official":true},{"id":"tracert-traceroute","name":"tracert / traceroute","category":"RECON","objectives":"2.1","purpose":"Identify the routers and hops along a network path.","clue":"Determine which hops traffic traverses to reach a destination.","memory":"TRACE the ROUTE hop by hop.","contrast":"ping tests reachability; traceroute shows the route.","official":false},{"id":"curl","name":"curl","category":"RECON","objectives":"2.1, 2.3","purpose":"Make HTTP and other protocol requests from a command line; inspect responses.","clue":"Retrieve headers or send an HTTP request from a shell.","memory":"cURL curls a URL into the terminal.","contrast":"Postman is an API-focused GUI; curl is CLI-friendly.","official":false},{"id":"wget","name":"wget","category":"RECON","objectives":"2.1, 2.3","purpose":"Download web pages or files from URLs using a command line.","clue":"Retrieve a file noninteractively in a Linux shell script.","memory":"WGET = Web GET.","contrast":"curl is more general for crafting requests; wget specializes in downloading.","official":false},{"id":"nikto","name":"Nikto","category":"VULN","objectives":"3.1","purpose":"Scan web servers for known risky files, server configuration issues, and outdated components.","clue":"The target is a web server and the task is to find dangerous files and weak headers.","memory":"NIKTO knocks on web-server doors.","contrast":"Nessus scans broader systems; Nikto specializes in web servers.","official":true},{"id":"greenbone-openvas","name":"Greenbone / OpenVAS","category":"VULN","objectives":"3.1","purpose":"Run general-purpose vulnerability scans with an open-source vulnerability-management platform.","clue":"You need a free, open-source alternative to a commercial network vulnerability scanner.","memory":"OpenVAS = OPEN Vulnerability Assessment Scanner.","contrast":"Nessus is commercial; OpenVAS/Greenbone is open-source.","official":true},{"id":"trufflehog","name":"TruffleHog","category":"VULN","objectives":"3.1, 4.5","purpose":"Search repositories, files, and history for exposed credentials and API tokens.","clue":"A developer accidentally committed an API key to Git history.","memory":"A truffle hog sniffs out buried secrets.","contrast":"Trivy can scan images and code; TruffleHog focuses on secrets.","official":true},{"id":"bloodhound","name":"BloodHound","category":"VULN","objectives":"3.1, 4.3","purpose":"Graph Active Directory permissions, relationships, and potential attack paths.","clue":"Find the shortest relationship path from a user to Domain Admin.","memory":"A bloodhound follows the permission trail.","contrast":"PowerView queries AD objects; BloodHound graphs paths.","official":true},{"id":"tenable-nessus","name":"Tenable Nessus","category":"VULN","objectives":"3.1","purpose":"Perform commercial vulnerability scans and prioritize identified findings.","clue":"Scan hosts for missing patches, CVEs, and insecure configurations.","memory":"Nessus notices network weaknesses.","contrast":"Nmap maps ports; Nessus searches for known vulnerabilities.","official":true},{"id":"powersploit","name":"PowerSploit","category":"VULN","objectives":"3.1, 4.10","purpose":"Collection of PowerShell security testing and post-exploitation modules.","clue":"Use PowerShell modules for Windows/AD reconnaissance and security testing.","memory":"PowerSploit = PowerShell exploitation toolbox.","contrast":"PowerView is one component focused on Active Directory enumeration.","official":true},{"id":"grype","name":"Grype","category":"VULN","objectives":"3.1","purpose":"Identify known vulnerabilities in container images and software artifacts.","clue":"A container image needs a list of packages with known CVEs.","memory":"Grype GRIPs image vulnerabilities.","contrast":"Trivy covers more surfaces including IaC and secrets.","official":true},{"id":"trivy","name":"Trivy","category":"VULN","objectives":"3.1","purpose":"Scan container images, filesystems, dependencies, and IaC for vulnerabilities and misconfigurations.","clue":"Assess images and Terraform-style templates with one scanner.","memory":"TRI-vy checks multiple layers, not just one.","contrast":"Grype emphasizes known package vulnerabilities; Trivy has broad scanner modes.","official":true},{"id":"kube-hunter","name":"Kube-hunter","category":"VULN","objectives":"3.1, 4.6","purpose":"Probe Kubernetes clusters for exposed or insecure services and configurations.","clue":"Search for an exposed Kubernetes API or kubelet weakness.","memory":"KUBE-hunter hunts Kubernetes holes.","contrast":"Docker Bench checks Docker configuration against a benchmark.","official":true},{"id":"nessus-essentials","name":"Nessus Essentials","category":"VULN","objectives":"3.1","purpose":"Free, limited edition of the Nessus vulnerability scanner.","clue":"A small lab needs Nessus scanning with a constrained license.","memory":"Essentials = essential, limited Nessus.","contrast":"The core scanner is Nessus, not a separate scanning method.","official":false},{"id":"qualys","name":"Qualys","category":"VULN","objectives":"3.1","purpose":"Commercial cloud-managed platform for vulnerability assessment and management.","clue":"A company wants centrally managed vulnerability scanning delivered as SaaS.","memory":"Qualys qualifies the vulnerability list from the cloud.","contrast":"Nessus is another commercial scanner; Qualys emphasizes cloud-managed service.","official":false},{"id":"owasp-dependency-check","name":"OWASP Dependency-Check","category":"VULN","objectives":"3.1","purpose":"Detect known vulnerable third-party software dependencies through software composition analysis.","clue":"A software project needs CVE checks for its dependency versions.","memory":"DEPENDENCY-Check checks the packages you depend on.","contrast":"TruffleHog searches for secrets, not vulnerable libraries.","official":false},{"id":"docker-bench","name":"Docker Bench","category":"CLOUD","objectives":"4.6","purpose":"Audit Docker host and container settings against CIS security guidance.","clue":"Check Docker host configuration against hardening benchmarks.","memory":"Docker Bench = Docker on the security workbench.","contrast":"Kube-hunter probes Kubernetes attack surfaces rather than benchmarking Docker settings.","official":true},{"id":"metasploit","name":"Metasploit","category":"NETWORK","objectives":"4.2, 5.2","purpose":"Framework to select, configure, and run exploit and post-exploitation modules.","clue":"A tester has a known service vulnerability and wants a modular exploitation framework.","memory":"META = many exploits in one toolkit.","contrast":"msfvenom generates payloads; Metasploit runs exploit modules.","official":true},{"id":"netcat","name":"Netcat","category":"NETWORK","objectives":"4.2, 5.2","purpose":"Read/write raw TCP or UDP connections, transfer data, and create listeners or shells.","clue":"Open a TCP listener, test a port, or move data over a basic socket.","memory":"Netcat = the Swiss Army cat of network connections.","contrast":"Nmap scans; Netcat connects and transfers data.","official":true},{"id":"impacket","name":"Impacket","category":"NETWORK","objectives":"4.2, 4.10, 5.2","purpose":"Python toolkit implementing network protocols; includes SMB, Kerberos, relay, and remote execution tools.","clue":"The question names ntlmrelayx, secretsdump, or psexec.py.","memory":"IMPACKET = impacts protocols with Python packets.","contrast":"Responder captures auth; Impacket ntlmrelayx can relay it.","official":true},{"id":"crackmapexec-cme","name":"CrackMapExec (CME)","category":"AUTH","objectives":"4.2, 4.3, 5.2","purpose":"Automate SMB and Active Directory enumeration, authentication checks, and remote operations across hosts.","clue":"Check credentials or enumerate SMB shares across many Windows hosts.","memory":"Crack MAP Execute across a MAP of computers.","contrast":"PsExec runs commands on a host; CME scales across many hosts.","official":true},{"id":"msfvenom","name":"msfvenom","category":"NETWORK","objectives":"4.2","purpose":"Generate and format payloads for use in approved exploitation tests.","clue":"Build a payload file for a controlled lab exploit.","memory":"VENOM makes the payload; Metasploit delivers the bite.","contrast":"Metasploit is the exploit framework; msfvenom is the payload generator.","official":true},{"id":"responder","name":"Responder","category":"NETWORK","objectives":"4.2, 4.3","purpose":"Answer/poison certain local name-resolution requests to capture network authentication attempts.","clue":"Clients broadcast LLMNR/NBT-NS requests and the tester needs to capture NetNTLM authentication.","memory":"Responder responds to lost-name requests.","contrast":"Responder captures; Impacket ntlmrelayx relays.","official":true},{"id":"hydra","name":"Hydra","category":"AUTH","objectives":"4.2, 4.3","purpose":"Test passwords against live network logins across multiple protocols.","clue":"Try a permitted username/password list against SSH or an HTTP login.","memory":"HYDRA has many heads for many login protocols.","contrast":"Hydra and Medusa are online; hashcat and John work offline.","official":true},{"id":"hashcat","name":"hashcat","category":"AUTH","objectives":"4.3","purpose":"Recover passwords by testing guesses against captured password hashes, often using GPUs.","clue":"You already have hashes and want offline GPU-accelerated cracking.","memory":"HASH-cat chases hashes, not websites.","contrast":"Hydra tries live logins; hashcat cracks offline hashes.","official":true},{"id":"john-the-ripper","name":"John the Ripper","category":"AUTH","objectives":"4.3","purpose":"Perform offline password-hash auditing and recovery with diverse hash formats.","clue":"An offline Unix-style password hash file needs wordlist or rule attacks.","memory":"JOHN rips open password hashes.","contrast":"Like hashcat, it is offline; John is often associated with format handling.","official":true},{"id":"medusa","name":"Medusa","category":"AUTH","objectives":"4.3","purpose":"Parallel, modular online password-auditing tool for remote services.","clue":"A question describes many parallel login guesses against a live service.","memory":"Many Medusa heads try many live logins.","contrast":"Hydra is another online brute-force tool; neither is an offline hash cracker.","official":true},{"id":"mimikatz","name":"Mimikatz","category":"HOST","objectives":"4.4, 5.2","purpose":"Security research tool associated with extracting Windows credential material and Kerberos tickets.","clue":"A tester needs to examine LSASS-resident credentials or tickets on Windows.","memory":"MIMI-KATZ digs credentials out of Windows memory.","contrast":"Rubeus specializes in Kerberos; Mimikatz has broader credential features.","official":true},{"id":"rubeus","name":"Rubeus","category":"HOST","objectives":"4.4","purpose":"Toolkit for Kerberos ticket operations and testing, including Kerberoasting and ticket abuse.","clue":"The scenario mentions AS-REP roasting, Kerberoasting, or pass-the-ticket.","memory":"RUBEUS rides the Kerberos ticket bus.","contrast":"Certify focuses on certificates; Rubeus focuses on Kerberos tickets.","official":true},{"id":"certify","name":"Certify","category":"HOST","objectives":"4.4","purpose":"Enumerate and test Active Directory Certificate Services (AD CS) weaknesses.","clue":"A vulnerable certificate template could let an account request unintended privileges.","memory":"CERTIFY = CERTIFICATE security testing.","contrast":"Rubeus works on Kerberos tickets; Certify on AD CS certificates.","official":true},{"id":"seatbelt","name":"Seatbelt","category":"HOST","objectives":"4.4","purpose":"Collect local Windows host-security and situational-awareness information.","clue":"Enumerate a Windows endpoint's users, configurations, and privilege-escalation clues.","memory":"Fasten your SEATBELT before exploring a host.","contrast":"BloodHound maps an entire AD graph; Seatbelt surveys one host.","official":true},{"id":"powershell-ise","name":"PowerShell / ISE","category":"SCRIPT","objectives":"4.4, 4.10, 5.2","purpose":"Windows automation and scripting environment; ISE provides an integrated script editor.","clue":"Automate Windows host tasks or inspect a script with Verb-Noun cmdlets.","memory":"POWER shell gives Windows commands extra power.","contrast":"Bash is Unix shell scripting; PowerShell uses Verb-Noun cmdlets and objects.","official":true},{"id":"psexec","name":"PsExec","category":"POST","objectives":"4.4, 5.2","purpose":"Run commands remotely on Windows hosts, commonly through SMB and a temporary service.","clue":"Use valid administrative access to execute a program on another Windows machine.","memory":"P-S-EXEC = push a process and EXECute it.","contrast":"Evil-WinRM uses WinRM; PsExec commonly uses SMB/service creation.","official":true},{"id":"evil-winrm","name":"Evil-WinRM","category":"HOST","objectives":"4.4","purpose":"Provide an interactive remote shell through Windows Remote Management.","clue":"The target has WinRM access on port 5985 or 5986.","memory":"Evil-WinRM = WINdows Remote Management shell.","contrast":"PsExec uses SMB-based remote execution rather than WinRM.","official":true},{"id":"lolbins","name":"LOLbins","category":"POST","objectives":"4.4, 5.2","purpose":"Legitimate operating-system binaries that can be repurposed for attacker actions.","clue":"Use trusted built-in Windows utilities instead of downloading a separate executable.","memory":"LOL = Live Off the Land with native binaries.","contrast":"A category of utilities, ster focuses on enumeration modes.","official":true},{"id":"dirbuster","name":"DirBuster","category":"WEB","objectives":"4.5","purpose":"Discover hidden web-server directories and files with dictionary-based requests.","clue":"Brute-force unknown website paths in a directory discovery tool.","memory":"DIR-BUSTER busts open hidden directories.","contrast":"Gobuster is a popular command-line counterpart.","official":true},{"id":"wfuzz","name":"Wfuzz","category":"WEB","objectives":"4.5","purpose":"Fuzz web paths, headers, parameters, and request values using substitution positions.","clue":"Replace a query-string value with many candidate inputs and observe responses.","memory":"W-FUZZ = web fuzz anywhere.","contrast":"Gobuster focuses on content discovery; Wfuzz changes arbitrary request locations.","official":true},{"id":"wpscan","name":"WPScan","category":"WEB","objectives":"4.5","purpose":"Enumerate and assess WordPress versions, plugins, themes, and users for known issues.","clue":"The site uses WordPress and needs a platform-specific security scan.","memory":"WP = WordPress, Scan = scan it.","contrast":"Nikto is web-server general; WPScan is WordPress-specific.","official":true},{"id":"pacu","name":"Pacu","category":"CLOUD","objectives":"4.6","purpose":"Framework for authorized offensive assessment of AWS permissions and cloud misconfigurations.","clue":"An AWS engagement needs an offensive framework to test IAM abuse paths.","memory":"PA-CU = Pounce At Cloud Users (AWS).","contrast":"Prowler/ScoutSuite audit posture; Pacu is offensive assessment.","official":true},{"id":"prowler","name":"Prowler","category":"CLOUD","objectives":"4.6","purpose":"Audit cloud security posture, permissions, and configuration against security checks.","clue":"Check cloud accounts for security and compliance weaknesses rather than exploiting them.","memory":"A prowler patrols cloud settings.","contrast":"Pacu actively tests exploitation; Prowler inspects posture.","official":true},{"id":"scoutsuite","name":"ScoutSuite","category":"CLOUD","objectives":"4.6","purpose":"Assess security posture across multiple cloud providers and produce findings.","clue":"Evaluate configuration exposure across AWS, Azure, or Google Cloud environments.","memory":"SCOUT surveys many clouds.","contrast":"Prowler also supports cloud auditing; Pacu is the offensive AWS framework.","official":true},{"id":"cloud-native-vendor-tools","name":"Cloud-native vendor tools","category":"CLOUD","objectives":"4.6","purpose":"Provider-supplied tools and consoles used to inspect and test cloud environments.","clue":"A task requires the cloud provider's own CLI, audit logs, or resource inventory.","memory":"Cloud-native = the cloud's own tools.","contrast":"The category depends on provider and permissions, not a single product.","official":true},{"id":"wpad","name":"WPAD","category":"WIRELESS","objectives":"4.7","purpose":"Web Proxy Auto-Discovery mechanism that can be abused to redirect proxy traffic.","clue":"A device is tricked into accepting a malicious wpad.dat proxy configuration.","memory":"WPAD = Web Proxy Auto-Discovery.","contrast":"WPAD is a discovery protocol, not itself a dedicated Wi-Fi attack suite.","official":true},{"id":"wifi-pumpkin","name":"WiFi-Pumpkin","category":"WIRELESS","objectives":"4.7","purpose":"Framework used to configure rogue Wi-Fi access points and captive-portal tests.","clue":"The engagement requires an evil twin access point imitating a trusted SSID.","memory":"A Wi-Fi pumpkin is a fake glowing hotspot.","contrast":"Aircrack-ng focuses on capture/cracking; WiFi-Pumpkin on rogue access points.","official":true},{"id":"kismet","name":"Kismet","category":"WIRELESS","objectives":"4.7","purpose":"Detect and analyze wireless networks and traffic, including hidden SSID activity.","clue":"Passively monitor Wi-Fi frames and discover nearby wireless networks.","memory":"KISMET quietly listens instead of shouting.","contrast":"InSSIDer surveys signal/channels ntrast":"Wireshark inspects packets; Scapy can craft and transmit them.","official":true},{"id":"tcprelay","name":"tcprelay","category":"MOBILE","objectives":"4.9","purpose":"Tool name listed for specialized-system attack scenarios involving relayed network traffic.","clue":"An operational-technology scenario calls for relaying traffic between endpoints.","memory":"TCP RELAY relays traffic between places.","contrast":"Do not confuse the objective's tcprelay name with the separate tcpreplay tool.","official":true},{"id":"mobsf","name":"MobSF","category":"MOBILE","objectives":"4.9","purpose":"Mobile Security Framework for static and dynamic application security analysis.","clue":"Upload an Android APK or iOS app to inspect application risks.","memory":"MOBile Security Framework examines mobile apps.","contrast":"Frida instruments running apps; Drozer tests Android components.","official":true},{"id":"frida","name":"Frida","category":"MOBILE","objectives":"4.9","purpose":"Instrument a running application and hook functions for dynamic security analysis.","clue":"Observe or change a mobile app function's behavior while it runs.","memory":"FRIDA fiddles with functions at runtime.","contrast":"MobSF is an analysis platform; Frida is runtime instrumentation.","official":true},{"id":"drozer","name":"Drozer","category":"MOBILE","objectives":"4.9","purpose":"Assess Android applications, especially exported components and interprocess communication.","clue":"Test whether an Android app's exported activity or content provider is exposed.","memory":"DROZER drills Android components.","contrast":"ADB controls the device; Drozer tests application attack surfaces.","official":true},{"id":"adb-android-debug-bridge","name":"ADB (Android Debug Bridge)","category":"MOBILE","objectives":"4.9","purpose":"Communicate with an Android device to install apps, run shell commands, and debug.","clue":"Install an APK, obtain a device shell, or inspect a connected Android phone.","memory":"ADB = Android Device Bridge.","contrast":"Frida instruments app runtime; ADB is the device-control bridge.","official":true},{"id":"bluestrike","name":"Bluestrike","category":"MOBILE","objectives":"4.9","purpose":"Bluetooth-related attack tooling named for specialized-system testing.","clue":"A scenario specifically calls for a Bluetooth attack tool.","memory":"BLUE-strike strikes Bluetooth.","contrast":"Not a generic Wi-Fi scanner like Kismet.","official":true},{"id":"powerview","name":"PowerView","category":"SCRIPT","objectives":"4.10","purpose":"PowerShell tooling for enumerating Active Directory users, groups, computers, and permissions.","clue":"The tester wants PowerShell queries of AD trusts or object permissions.","memory":"PowerVIEW gives a view into Active Directory.","contrast":"BloodHound graphs AD paths; PowerView enumerates/query objects.","official":true},{"id":"powerupsql","name":"PowerUpSQL","category":"SCRIPT","objectives":"4.10","purpose":"PowerShell toolkit for SQL Server discovery, auditing, and attack-path analysis.","clue":"Enumerate SQL Server instances and risky database permissions with PowerShell.","memory":"Power UP SQL for Microsoft SQL Server.","contrast":"sqlmap focuses on web SQL injection; PowerUpSQL focuses on SQL Server environments.","official":true},{"id":"ad-search","name":"AD search","category":"SCRIPT","objectives":"4.10","purpose":"Search Active Directory records for people, machines, groups, and attributes in scripts.","clue":"A PowerShell script queries domain objects using directory search methods.","memory":"AD SEARCH = search the Active Directory.","contrast":"A scripting technique/category, not one named standalone product.","official":true},{"id":"bash","name":"Bash","category":"SCRIPT","objectives":"2.3, 4.10","purpose":"Unix shell and scripting language for piping commands, loops, files, and automation.","clue":"A script has #!/bin/bash, do/done, or variables such as $1.","memory":"BASH bangs commands together in a shell.","contrast":"PowerShell uses Verb-Noun cmdlets; Python uses indentation and imports.","official":true},{"id":"python","name":"Python","category":"SCRIPT","objectives":"2.3, 4.10","purpose":"General-purpose language for automating reconnaissance, packet manipulation, and data processing.","clue":"A script uses import, def, for, and indentation to automate testing.","memory":"PYTHON winds scripts around security tools.","contrast":"Bash chains shell commands; Python provides libraries and structured programming.","official":true},{"id":"caldera","name":"Caldera","category":"SCRIPT","objectives":"4.10","purpose":"MITRE platform that automates adversary emulation mapped to ATT&CK techniques.","clue":"Run an organized multi-step emulated adversary operation.","memory":"A CALDERA simulates a whole eruption of attacks.","contrast":"Atomic Red Team focuses on individual atomic technique tests.","official":true},{"id":"infection-monkey","name":"Infection Monkey","category":"SCRIPT","objectives":"4.10","purpose":"Breach and attack simulation platform assessing network spread and segmentation.","clue":"Test how far a simulated compromise could propagate across systems.","memory":"Infection Monkey swings from host to host.","contrast":"Caldera orchestrates ATT&CK emulations; Monkey explores lateral spread.","official":true},{"id":"atomic-red-team","name":"Atomic Red Team","category":"SCRIPT","objectives":"4.10","purpose":"Collection of small tests for individual ATT&CK techniques and detection validation.","clue":"Validate whether a security control detects a single ATT&CK behavior.","memory":"ATOMIC = one small experiment at a time.","contrast":"Caldera runs broader operations; Atomic Red Team offers focused tests.","official":true},{"id":"covenant","name":"Covenant","category":"POST","objectives":"5.2","purpose":".NET command-and-control framework used in authorized post-exploitation testing.","clue":"A tester needs a .NET-centric C2 platform and Grunt agents.","memory":"COVENANT keeps .NET agents in contact.","contrast":"Empire is known for PowerShell/Python; Sliver is cross-platform Go.","official":true},{"id":"sshuttle","name":"sshuttle","category":"POST","objectives":"5.2","purpose":"Create a VPN-like network pivot through an SSH connection to reach subnets.","clue":"Access an internal subnet through an approved SSH foothold.","memory":"SSHUTTLE shuttles a subnet through SSH.","contrast":"Proxychains routes selected applications through proxies.","official":true},{"id":"proxychains","name":"Proxychains","category":"POST","objectives":"5.2","purpose":"Run applications with network traffic routed through one or more proxies.","clue":"Send a tool's connections through a SOCKS proxy via a foothold.","memory":"CHAIN your tool to a PROXY.","contrast":"sshuttle provides subnet-like forwarding; Proxychains wraps individual programs.","official":true},{"id":"batch-files","name":"Batch files","category":"POST","objectives":"5.2","purpose":"Windows .bat or .cmd scripts that automate command-prompt tasks.","clue":"Automate a repeated sequence of Windows command-line actions.","memory":"BATCH = batch a stack of commands.","contrast":"PowerShell handles objects and richer scripting; batch runs cmd.exe commands.","official":true},{"id":"net-commands","name":"Net commands","category":"POST","objectives":"5.2","purpose":"Built-in Windows net.exe commands to inspect or manage users, groups, shares, and services.","clue":"Enumerate Windows users or shares with built-in net user/net share commands.","memory":"NET commands reveal NETwork accounts and shares.","contrast":"netstat reveals sockets; net commands reveal accounts/shares/services.","official":true},{"id":"cmd-exe","name":"cmd.exe","category":"POST","objectives":"5.2","purpose":"Windows Command Prompt interpreter used to run native commands and batch scripts.","clue":"A host provides the standard Windows command shell.","memory":"CMD = CoMmanD interpreter.","contrast":"PowerShell is an object-based scripting shell; cmd.exe is the classic shell.","official":true},{"id":"explorer-exe","name":"explorer.exe","category":"POST","objectives":"5.2","purpose":"Windows graphical file manager and shell process, sometimes abused as a trusted binary.","clue":"Identify the native process that presents the Windows desktop and file browsing.","memory":"EXPLORER explores files and the desktop.","contrast":"It is a Windows native binary, not a penetration-testing suite.","official":true},{"id":"ftp-exe","name":"ftp.exe","category":"POST","objectives":"5.2","purpose":"Built-in Windows FTP client for interactive file transfers over FTP.","clue":"A Windows host uses a native FTP utility to transfer files.","memory":"FTP = File Transfer Program.","contrast":"A native Windows LOLBin, not a dedicated exfiltration framework.","official":true},{"id":"mmc-exe","name":"mmc.exe","category":"POST","objectives":"5.2","purpose":"Microsoft Management Console host for administrative snap-ins.","clue":"Identify the signed Windows management-console executable.","memory":"MMC = Microsoft Management Console.","contrast":"It hosts administrative consoles; it is not a credential-dumping tool.","official":true},{"id":"rundll32-exe","name":"rundll32.exe","category":"POST","objectives":"5.2","purpose":"Windows utility for invoking exported routines from DLLs; can be abused as a LOLBin.","clue":"A signed Windows binary is used to execute a DLL export.","memory":"RUN DLL 32 = run a dynamic link library routine.","contrast":"A native binary under LOLBins, not a stand-alone exploit framework.","official":true},{"id":"msbuild-exe","name":"msbuild.exe","category":"POST","objectives":"5.2","purpose":"Microsoft build tool that processes build projects and can be misused to execute embedded tasks.","clue":"A native Windows build utility unexpectedly executes code from a project file.","memory":"MS BUILD builds projects but can execute project tasks.","contrast":"A LOLBin example; do not confuse with msfvenom payload generation.","official":true},{"id":"route","name":"route","category":"POST","objectives":"5.2","purpose":"Show or modify the system's IP routing table.","clue":"After reaching a host, inspect network paths to another subnet.","memory":"ROUTE shows where packets go next.","contrast":"netstat shows sockets; route shows paths to networks.","official":true},{"id":"strings-findstr-exe","name":"strings / findstr.exe","category":"POST","objectives":"5.2","purpose":"Search for readable strings inside files or text and identify sensitive artifacts.","clue":"Find credential-like patterns in a local file or executable.","memory":"Find STRings, find STR evidence.","contrast":"These are search utilities, not password crackers.","official":true},{"id":"airgeddon","name":"Airgeddon","category":"WIRELESS","objectives":"4.7","purpose":"Menu-driven wireless security-auditing toolkit that orchestrates multiple Wi-Fi tools.","clue":"A tester wants an integrated wireless workflow built around existing capture and attack tools.","memory":"AIRgeddon = wireless armageddon in one menu.","contrast":"Aircrack-ng is a core suite; Airgeddon wraps several utilities.","official":false},{"id":"cain-abel","name":"Cain & Abel","category":"AUTH","objectives":"4.3","purpose":"Legacy Windows password-recovery toolkit with sniffing and cracking functions.","clue":"A question mentions an older Windows suite for password recovery and traffic capture.","memory":"CAIN cracks, ABEL assists: old Windows password tools.","contrast":"hashcat and John are modern offline password auditing choices.","official":false},{"id":"cuckoo-sandbox","name":"Cuckoo Sandbox","category":"VULN","objectives":"3.2","purpose":"Analyze suspicious software behavior inside an isolated sandbox environment.","clue":"Observe what a suspicious executable changes without using a production machine.","memory":"CUCKOO keeps suspicious software in a separate nest.","contrast":"Malware behavior analysis, not a network-vulnerability scanner.","official":false},{"id":"empire","name":"Empire","category":"POST","objectives":"5.1, 5.2","purpose":"PowerShell/Python-oriented post-exploitation and command-and-control framework.","clue":"A red-team lab uses a classic scripting-oriented C2 system.","memory":"EMPIRE commands an army of scripts.","contrast":"Covenant is .NET-centric; Sliver is a cross-platform C2.","official":false},{"id":"ettercap","name":"Ettercap","category":"NETWORK","objectives":"4.2","purpose":"Perform local network traffic interception and man-in-the-middle testing, including ARP poisoning.","clue":"A tester needs a classic LAN on-path interception tool.","memory":"ETTERCAP catches traffic between endpoints.","contrast":"Responder specializes in name-resolution poisoning and credential capture.","official":false},{"id":"exploit-db-searchsploit","name":"Exploit-DB / searchsploit","category":"NETWORK","objectives":"4.1","purpose":"Search a public exploit-code database; searchsploit is its local command-line search utility.","clue":"Look up a publicly documented exploit without executing it.","memory":"SEARCH-sploit searches; Meta-sploit exploits.","contrast":"Metasploit runs modules; Exploit-DB catalogs exploit code.","official":false},{"id":"hping3","name":"hping3","category":"NETWORK","objectives":"4.2","purpose":"Craft configurable TCP/IP probes for firewall and packet-behavior testing.","clue":"Send custom packet flags from a command-line utility.","memory":"H-PING = hand-crafted ping with extra headers.","contrast":"Scapy is Python-based packet construction; hping3 is a CLI probe tool.","official":false},{"id":"plink-putty-link","name":"Plink (PuTTY Link)","category":"POST","objectives":"5.2","purpose":"PuTTY command-line client that can establish SSH sessions and forwarding.","clue":"A Windows machine needs SSH-based port forwarding from the command line.","memory":"P-LINK links ports with PuTTY.","contrast":"sshuttle offers VPN-like routing; Plink is a command-line SSH utility.","official":false},{"id":"sliver","name":"Sliver","category":"POST","objectives":"5.1, 5.2","purpose":"Cross-platform command-and-control platform designed for security exercises.","clue":"A red-team lab wants a modern multi-platform C2 system.","memory":"SLIVER slips across platforms.","contrast":"Covenant emphasizes .NET; Empire is known for PowerShell/Python.","official":false},{"id":"tcpreplay","name":"tcpreplay","category":"MOBILE","objectives":"4.9","purpose":"Replay previously captured packets from a PCAP onto a network interface.","clue":"Reproduce previously captured traffic at controlled speeds in a lab.","memory":"TCP REPLAY = press play on packets.","contrast":"Scapy creates new/custom packets; tcpreplay replays captured ones.","official":false}];
const CAT={RECON:'Recon & OSINT',VULN:'Vulnerability discovery',NETWORK:'Network attacks',AUTH:'Authentication',HOST:'Windows & AD',WEB:'Web & APIs',CLOUD:'Cloud & containers',WIRELESS:'Wireless',SOCIAL:'Social engineering',MOBILE:'Mobile, OT & packets',SCRIPT:'Scripting & simulation',POST:'Post-exploitation'};
const ORDER=['RECON','VULN','NETWORK','AUTH','HOST','WEB','CLOUD','WIRELESS','SOCIAL','MOBILE','SCRIPT','POST'];
const COMPARES=[
['Nmap vs Nessus','Nmap','Maps ports, services, and OS clues','Tenable Nessus','Scans known vulnerabilities and patches','Discovery of exposure ≠ confirmation of a known weakness.'],
['Responder vs ntlmrelayx','Responder','Poisons local name resolution to capture auth','Impacket','ntlmrelayx relays captured auth onward','CAPTURE ≠ RELAY.'],
['Hydra vs hashcat','Hydra','Tries credentials against a live login service','hashcat','Tests passwords against offline hashes','ONLINE login attempts ≠ OFFLINE hash cracking.'],
['hashcat vs John','hashcat','GPU-friendly offline hash cracking','John the Ripper','Flexible offline hash auditing','Both are offline; neither needs to log into the target.'],
['Metasploit vs msfvenom','Metasploit','Runs modular exploits and sessions','msfvenom','Generates payload binaries and strings','EXPLOIT FRAMEWORK ≠ PAYLOAD GENERATOR.'],
['Burp Suite vs Postman','Burp Suite','Intercepts and modifies web traffic','Postman','Builds and sends API requests','WEB PROXY ≠ API REQUEST BUILDER.'],
['Gobuster vs Wfuzz','Gobuster','Finds hidden directories and virtual hosts','Wfuzz','Fuzzes arbitrary paths, headers and fields','DISCOVER PATHS ≠ FUZZ ANY INPUT.'],
['Nessus vs OpenVAS','Tenable Nessus','Commercial general vulnerability scanner','Greenbone / OpenVAS','Open-source vulnerability scanner','Same broad task; different licensing and platform.'],
['Pacu vs Prowler','Pacu','Offensive assessment of AWS environments','Prowler','Cloud configuration and compliance audit','ATTACK PATHS ≠ POSTURE AUDIT.'],
['Grype vs Trivy','Grype','Known-vulnerable packages in artifacts','Trivy','Broader scanning of images, IaC, and dependencies','Trivy has more scanner types.'],
['Mimikatz vs Rubeus','Mimikatz','Windows credential material and tickets','Rubeus','Kerberos-specific tickets and roasting','CREDENTIAL DUMPING ≠ KERBEROS-SPECIALIST.'],
['Certify vs BloodHound','Certify','AD Certificate Services weaknesses','BloodHound','Graphs AD relationship attack paths','CERTIFICATE TEMPLATE ≠ AD PATH GRAPH.'],
['PsExec vs Evil-WinRM','PsExec','Remote command execution commonly via SMB','Evil-WinRM','Interactive shell over WinRM','SMB / temporary service ≠ WINRM SHELL.'],
['Shodan vs Censys','Shodan','Existing index of exposed device banners','Censys.io','Internet host and certificate observations','Both can support passive recon; cert focus suggests Censys.'],
['WiGLE vs InSSIDer','WiGLE.net','Global crowdsourced Wi-Fi map','InSSIDer','Local Wi-Fi channel and signal survey','WORLDWIDE DATABASE ≠ LOCAL SIGNAL SURVEY.'],
['Kismet vs Aircrack-ng','Kismet','Wireless detection and monitoring','Aircrack-ng','Capture and wireless key auditing','LISTEN ≠ CAPTURE AND CRACK.'],
['SET vs Gophish','SET (Social-Engineer Toolkit)','Broad social-engineering simulation toolkit','Gophish','Phishing campaigns, templates, and metrics','ATTACK VECTORS ≠ CAMPAIGN METRICS.'],
['MobSF vs Frida','MobSF','Mobile app analysis platform','Frida','Runtime function instrumentation','APP SECURITY REPORT ≠ LIVE HOOK.'],
['Scapy vs tcpreplay','Scapy','Constructs and manipulates custom packets','tcpreplay','Resends packets saved in a PCAP','CRAFT NEW ≠ REPLAY RECORDED.'],
['Caldera vs Atomic Red Team','Caldera','Multi-step adversary emulation operations','Atomic Red Team','Individual ATT&CK technique tests','OPERATION ≠ ONE ATOMIC TEST.'],
['Proxychains vs sshuttle','Proxychains','Proxy routing for selected programs','sshuttle','VPN-like routing of subnets over SSH','APPLICATION PROXY ≠ SUBNET-LIKE TUNNEL.']
];
const STORE_KEY='pt003_tooldeck_state_v2';
let progress={};let favorite={};let settings={};
try{let s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');progress=s.progress||{};favorite=s.favorite||{};settings=s.settings||{}}catch(e){}
let view={tab:'study',mode:settings.mode||'scenario',scope:settings.scope||'official',category:settings.category||'ALL',shuffle:settings.shuffle===true,queue:[],position:0,flipped:false,detail:null,query:'',sessionDone:0};
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({progress,favorite,settings:{mode:view.mode,scope:view.scope,category:view.category,shuffle:view.shuffle}}))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=()=>localDate(new Date());
const getP=id=>progress[id]||{attempts:0,streak:0,misses:0,last:'',due:''};
function isDue(c){let p=getP(c.id);return p.attempts>0&&p.due<=today()}
function categoryCount(k){return DATA.filter(c=>c.category===k).length}
function filterCards(){return DATA.filter(c=>{let p=getP(c.id);if(view.category!=='ALL'&&c.category!==view.category)return false;switch(view.scope){case 'official':return c.official;case 'extra':return !c.official;case 'starred':return !!favorite[c.id];case 'missed':return p.last==='again';case 'due':return isDue(c);case 'unseen':return !p.attempts;default:return true}})}
function mix(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function begin(){let cards=filterCards();view.queue=cards.map(c=>c.id);if(view.shuffle)mix(view.queue);view.position=0;view.flipped=false;view.sessionDone=0;render()}
function current(){return DATA.find(c=>c.id===view.queue[view.position])}
function stats(){let n=0,known=0,mastered=0,missed=0,due=0;DATA.forEach(c=>{let p=getP(c.id);if(p.attempts)n++;if(p.last==='good')known++;if(p.streak>=2)mastered++;if(p.last==='again')missed++;if(isDue(c))due++});return{n,known,mastered,missed,due}}
function iconFor(cat){return {RECON:'R',VULN:'V',NETWORK:'N',AUTH:'A',HOST:'H',WEB:'W',CLOUD:'C',WIRELESS:'Wi',SOCIAL:'S',MOBILE:'M',SCRIPT:'Py',POST:'P'}[cat]}
function mark(type){let c=current();if(!c||!view.flipped)return;let p=getP(c.id);p.attempts++;p.last=type;p.lastAt=new Date().toISOString();if(type==='good'){p.streak=(p.streak||0)+1;p.due=datePlus([0,1,3,7,14,30,60][Math.min(p.streak,6)])}else{p.streak=0;p.misses=(p.misses||0)+1;p.due=today()}progress[c.id]=p;save();view.position++;view.flipped=false;view.sessionDone++;render();window.scrollTo({top:0,behavior:'smooth'})}
function datePlus(days){let d=new Date();d.setDate(d.getDate()+days);return localDate(d)}
function flip(){let c=current();if(!c)return;view.flipped=!view.flipped;let el=document.getElementById('studyCard');if(el){el.classList.toggle('is-flipped',view.flipped);el.setAttribute('aria-label',view.flipped?'Hide answer':'Reveal answer')}let rev=document.getElementById('revealBtn');if(rev)rev.textContent=view.flipped?'Hide answer':'Reveal answer';let no=document.getElementById('againBtn');let yes=document.getElementById('goodBtn');if(no)no.disabled=!view.flipped;if(yes)yes.disabled=!view.flipped}
function hero(){let s=stats();return `<div class="hero"><div class="eyebrow">CompTIA PenTest+ · PT0-003</div><h1>Know the tool.<br><em>Spot the clue.</em></h1><p>113 tool cards. Real exam-style scenarios. Memory hooks that stick.</p><div class="stats"><div class="stat"><b>${DATA.length}</b><span>Total tools</span></div><div class="stat"><b>${s.known}</b><span>Recognized</span></div><div class="stat"><b>${s.missed}</b><span>Review again</span></div></div></div>`}
function pill(c){return `<span class="pill ${c.official?'official':'extra'}">${c.official?'PT0-003 named':'Supplemental'}</span>`}
function optionSelect(){let scopes=[['official','Official exam tools'],['all','All 113 tools'],['extra','Supplemental only'],['starred','Starred only'],['missed','Need another review'],['due','Due for review'],['unseen','Not yet studied']];return `<div class="field"><div><label for="scope">STUDY DECK</label><select id="scope">${scopes.map(([v,t])=>`<option value="${v}" ${view.scope===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="category">TOPIC</label><select id="category"><option value="ALL">All topics</option>${ORDER.map(k=>`<option value="${k}" ${view.category===k?'selected':''}>${CAT[k]}</option>`).join('')}</select></div></div>`}
function study(){let c=current();let total=view.queue.length;let head=`<section class="panel setup"><div class="row"><span class="micro">Choose your drill</span><button class="btn subtle" style="min-height:30px;padding:6px 10px;font-size:11px" data-act="shuffle">${view.shuffle?'⤨ Shuffle on':'☷ In order'}</button></div>${optionSelect()}<div class="micro" style="margin:14px 0 8px">CARD FRONT</div><div class="mode"><button data-act="mode" data-value="scenario" class="${view.mode==='scenario'?'active':''}">Scenario → tool</button><button data-act="mode" data-value="name" class="${view.mode==='name'?'active':''}">Tool → purpose</button></div></section>`;
if(!c)return head+`<section class="panel empty"><b>${total===0?'No matching tools':'Deck complete!'}</b><p>${total===0?'Try another filter or star tools in the library.':'Great session. Repeat the deck or filter for missed tools.'}</p><button class="btn primary" data-act="begin">${total===0?'Study all tools':'Study this deck again'}</button></section>`;
let front=view.mode==='scenario'?`<div class="prompt">Which tool fits this scenario?</div><div class="scenario-front">${esc(c.clue)}</div><div class="hint-txt">Think of the tool's main job. Then check your answer.</div>`:`<div class="prompt">What does this tool do?</div><div class="front-title">${esc(c.name)}</div><div class="hint-txt">Recall its purpose, exam clue, and a memory hook.</div>`;
let back=`<div class="back-name">${esc(c.name)}</div><div class="answer-box"><label>WHAT IT DOES</label><p>${esc(c.purpose)}</p></div><div class="answer-box clue"><label>EXAM CLUE</label><p>${esc(c.clue)}</p></div><div class="answer-box mnemonic"><label>MAKE IT STICK</label><p>${esc(c.memory)}</p></div><div class="answer-box difference"><label>DON'T CONFUSE IT WITH</label><p>${esc(c.contrast)}</p></div>`;
return head+`<div class="session"><span>Card <b>${view.position+1}</b> of ${total}</span><span class="track"><span style="width:${100*view.position/total}%"></span></span></div><div class="flip-stage"><div id="studyCard" class="study-card ${view.flipped?'is-flipped':''}" role="button" tabindex="0" aria-label="Reveal answer" data-act="flip"><div class="card-inner"><div class="face"><div class="topline">${pill(c)}<span class="card-topic">${esc(CAT[c.category])}</span></div>${front}<div class="tap-hint"><span>Tap to reveal answer</span><span>↻</span></div></div><div class="face back"><div class="topline">${pill(c)}<span class="card-topic">OBJ ${esc(c.objectives)}</span></div>${back}</div></div></div></div><div class="actionrow"><button id="revealBtn" class="btn primary" data-act="flip">${view.flipped?'Hide answer':'Reveal answer'}</button><button class="btn subtle" data-act="skip">Skip →</button></div><div class="actionrow"><button id="againBtn" class="btn again" data-act="again" ${!view.flipped?'disabled':''}>× Review again</button><button id="goodBtn" class="btn good" data-act="good" ${!view.flipped?'disabled':''}>✓ Got it</button></div><div class="below"><button class="${favorite[c.id]?'on':''}" data-act="star" data-id="${c.id}">${favorite[c.id]?'★ Starred':'☆ Save for review'}</button><span class="fine">Mark your recall after revealing</span></div><div class="explain"><b style="color:#d4e7f5">Study tip</b><br>Read the clue, name the tool aloud, then reveal. If you mix two tools up, use the Compare tab to remember the deciding verb.</div>`}
function libItem(c){return `<button class="library-item" data-act="detail" data-id="${c.id}"><div class="tool-icon">${iconFor(c.category)}</div><div><strong>${esc(c.name)}</strong><p>${esc(c.purpose)}</p></div><span class="chev">›</span></button>`}
function libraryCards(){let q=view.query.toLowerCase().trim();return DATA.filter(c=>{let inScope=view.category==='ALL'||c.category===view.category;return inScope&&(!q||[c.name,c.purpose,c.clue,c.category,c.memory].join(' ').toLowerCase().includes(q))})}
function libraryResults(){let cards=libraryCards();return `<div class="summary-row">${cards.length} matching tools · Select one to review</div>${cards.map(libItem).join('')}${!cards.length?'<div class="panel empty">No tools match your search.</div>':''}`}
function library(){return `<div class="section-head"><h2>Tool library</h2><small>${DATA.length} cards</small></div><input id="search" class="search" autocomplete="off" spellcheck="false" placeholder="Search tools, clues, key terms..." value="${esc(view.query)}" aria-label="Search tools"><div class="field" style="display:block;margin:12px 0"><label for="libCategory" style="color:var(--sub);font-size:11px">FILTER BY TOPIC</label><select id="libCategory" style="width:100%;height:42px;background:#101e30;color:white;border:1px solid #33465c;border-radius:11px;padding:0 10px"><option value="ALL">All topics</option>${ORDER.map(k=>`<option value="${k}" ${view.category===k?'selected':''}>${CAT[k]} (${categoryCount(k)})</option>`).join('')}</select></div><div id="libResults">${libraryResults()}</div>`}
function compares(){return `<div class="section-head"><h2>Look-alike tools</h2><small>${COMPARES.length} distinctions</small></div><p class="subtext" style="margin-bottom:18px">On tool questions, the exact action verb usually decides the answer.</p>${COMPARES.map((p,i)=>`<details class="panel compare" ${i===0?'open':''}><summary>${esc(p[0])}</summary><div class="compare-grid"><div><strong>${esc(p[1])}</strong><p>${esc(p[2])}</p></div><div><strong>${esc(p[3])}</strong><p>${esc(p[4])}</p></div></div><div class="trap">EXAM DISTINCTION: ${esc(p[5])}</div></details>`).join('')}`}
function prog(){let s=stats();let pct=Math.round(s.n/DATA.length*100);return `<div class="section-head"><h2>Your progress</h2><small>Saved on this device</small></div><section class="panel" style="padding:19px"><div class="micro">Cards reviewed at least once</div><div class="row" style="margin:12px 0"><span class="bigscore">${pct}%</span><span class="subtext">${s.n} / ${DATA.length} studied<br>${s.mastered} remembered twice or more</span></div><div class="meter"><span style="width:${pct}%"></span></div></section><div class="section-head"><h2>Progress by topic</h2></div>${ORDER.map(k=>{let group=DATA.filter(c=>c.category===k);let n=group.filter(c=>getP(c.id).attempts).length;return `<div class="progress-row"><div class="row"><b>${CAT[k]}</b><small>${n}/${group.length}</small></div><div class="meter"><span style="width:${100*n/group.length}%"></span></div></div>`}).join('')}<div class="section-head"><h2>Quick review</h2></div><div class="actionrow"><button class="btn" data-act="quick" data-value="missed">× Missed (${s.missed})</button><button class="btn" data-act="quick" data-value="due">◷ Due (${s.due})</button></div><div class="actionrow"><button class="btn" data-act="quick" data-value="starred">★ Starred (${Object.values(favorite).filter(Boolean).length})</button><button class="btn" data-act="quick" data-value="unseen">○ Unseen (${DATA.length-s.n})</button></div><div class="section-head"><h2>Install & backup</h2></div><section class="panel" style="padding:17px"><b style="font-size:13px">iPhone Home Screen</b><p class="subtext">Once this app is hosted on HTTPS, open it in Safari and choose Share → Add to Home Screen. It can then work offline.</p><button class="btn subtle" data-act="export" style="width:100%">Export review progress (.json)</button><p class="fine">Progress is stored in this browser, not synced to other devices.</p><button class="danger-link" data-act="reset">Reset all progress</button></section>`}
function modal(){let c=DATA.find(c=>c.id===view.detail);if(!c)return '';let p=getP(c.id);return `<div class="sheet-wrap" data-act="close"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}"><div class="row"><span class="micro">${esc(CAT[c.category])} · ${esc(c.objectives)}</span><button class="btn subtle" style="min-height:30px;padding:5px 11px" data-act="close">✕ Close</button></div><div style="margin-top:17px">${pill(c)}</div><h2>${esc(c.name)}</h2><label>WHAT IT DOES</label><p>${esc(c.purpose)}</p><label>EXAM CLUE</label><p>${esc(c.clue)}</p><label>MEMORY HOOK</label><p class="mnem">${esc(c.memory)}</p><label>DISTINGUISH IT FROM</label><p>${esc(c.contrast)}</p><div class="actionrow"><button class="btn" data-act="star" data-id="${c.id}">${favorite[c.id]?'★ Unstar':'☆ Star'}</button><button class="btn primary" data-act="practice" data-id="${c.id}">Study this card</button></div><p class="fine">Previously reviewed: ${p.attempts} time${p.attempts===1?'':'s'}</p></section></div>`}
function tabs(){let list=[['study','▣','Study'],['library','☷','Library'],['compare','⇄','Compare'],['progress','◉','Progress']];return `<nav class="tabbar" aria-label="Main navigation">${list.map(([k,i,t])=>`<button class="tab ${view.tab===k?'selected':''}" aria-current="${view.tab===k?'page':'false'}" data-act="tab" data-value="${k}"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function render(){let main=view.tab==='study'?study():view.tab==='library'?library():view.tab==='compare'?compares():prog();document.getElementById('app').innerHTML=hero()+main+`<div class="footer">Made for PT0-003 revision · Authorized testing only<br>Objective-based cards + supplemental reference tools</div>`+tabs();document.getElementById('modal-root').innerHTML=modal()}
function toast(msg){let el=document.getElementById('toast-root');el.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',1700)}
function doAction(el){const act=el.dataset.act,id=el.dataset.id,v=el.dataset.value;switch(act){case 'tab':view.tab=v;view.detail=null;render();window.scrollTo(0,0);break;case 'flip':flip();break;case 'again':mark('again');break;case 'good':mark('good');break;case 'skip':if(current()){view.position++;view.flipped=false;render()}break;case 'begin':begin();break;case 'shuffle':view.shuffle=!view.shuffle;save();begin();break;case 'mode':view.mode=v;view.flipped=false;save();render();break;case 'star':favorite[id]=!favorite[id];save();render();toast(favorite[id]?'Saved to starred':'Removed from starred');break;case 'detail':view.detail=id;render();break;case 'close':view.detail=null;render();break;case 'practice':view.tab='study';view.scope='all';view.category='ALL';view.queue=[id];view.position=0;view.flipped=false;view.detail=null;render();window.scrollTo(0,0);break;case 'quick':view.tab='study';view.scope=v;view.category='ALL';begin();window.scrollTo(0,0);break;case 'export':exportProgress();break;case 'reset':if(confirm('Delete all tool review history and starred cards on this device?')){progress={};favorite={};save();begin();toast('Progress reset')}break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='close'&&e.target.closest('.sheet')&&!e.target.closest('button[data-act="close"]'))return;doAction(el)});
document.addEventListener('change',e=>{if(e.target.id==='scope'){view.scope=e.target.value;begin()}if(e.target.id==='category'||e.target.id==='libCategory'){view.category=e.target.value;if(view.tab==='study')begin();else render();save()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){view.query=e.target.value;let r=document.getElementById('libResults');if(r)r.innerHTML=libraryResults()}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='Escape'&&view.detail){view.detail=null;render();return}if(view.tab==='study'&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();flip()}if(view.tab==='study'&&view.flipped){if(e.key==='1')mark('again');if(e.key==='2')mark('good')}});
function exportProgress(){let blob=new Blob([JSON.stringify({format:'pt003-tooldeck-export',version:2,exportedAt:new Date().toISOString(),progress,favorite},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pt003-tooldeck-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
begin();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
